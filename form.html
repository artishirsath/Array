<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>

<body style="background-color: #f2f6fc; font-family: Arial, sans-serif;">

    <form>
    <div style="
        width: 500px;
        margin: 40px auto;
        padding: 30px;
        background-color: rgb(199, 233, 234);
        border: 1px solid #181818;
        border-radius: 12px;
        box-shadow: 0px 4px 15px rgba(12, 12, 12, 0.2);
    ">

        
        <div style="text-align: center; margin-bottom: 25px;">
            <h1 style="
                color: #0a011d;
                font-size: 28px;
                margin: 0;
            ">
                Student Registration Form
            </h1>

            <p style="color: #011f34; font-size: 14px;">
                Please enter your details
            </p>
        </div>


        
        <div style="margin-bottom: 15px;">
            <label style="font-size: 16px; color: #333;">
                Full Name:
            </label>

            <input type="text" placeholder="Enter your full name"
                style="
                width: 95%;
                padding: 10px;
                margin-top: 7px;
                border: 1px solid #aaa;
                border-radius: 6px;
                font-size: 15px;
            ">
        </div>


        
        <div style="margin-bottom: 15px;">
            <label style="font-size: 16px; color: #333;">
                Email:
            </label>

            <input type="email" placeholder="Enter your email"
                style="
                width: 95%;
                padding: 10px;
                margin-top: 7px;
                border: 1px solid #aaa;
                border-radius: 6px;
                font-size: 15px;
            ">
        </div>


        
        <div style="margin-bottom: 15px;">
            <label style="font-size: 16px; color: #333;">
                Password:
            </label>

            <input type="password" placeholder="Enter password"
                style="
                width: 95%;
                padding: 10px;
                margin-top: 7px;
                border: 1px solid #aaa;
                border-radius: 6px;
                font-size: 15px;
            ">
        </div>


        
        <div style="margin-bottom: 15px;">
            <label style="font-size: 16px; color: #333;">
                Mobile Number:
            </label>

            <input type="tel" placeholder="Enter mobile number"
                style="
                width: 95%;
                padding: 10px;
                margin-top: 7px;
                border: 1px solid #aaa;
                border-radius: 6px;
                font-size: 15px;
            ">
        </div>



        <div style="margin-bottom: 15px;">
            <label style="font-size: 16px; color: #333;">
                Date of Birth:
            </label>

            <input type="date"
                style="
                width: 95%;
                padding: 10px;
                margin-top: 7px;
                border: 1px solid #aaa;
                border-radius: 6px;
                font-size: 15px;
            ">
        </div>


    
        <div style="margin-bottom: 15px;">

            <label style="font-size: 16px; color: #333;">
                Gender:
            </label>

            <div style="margin-top: 8px;">

                <input type="radio" name="gender" value="Male">
                <label>Male</label>

                <input type="radio" name="gender" value="Female">
                <label>Female</label>

                <input type="radio" name="gender" value="Other">
                <label>Other</label>

            </div>
        </div>


    
        <div style="margin-bottom: 15px;">

            <label style="font-size: 16px; color: #333;">
                Course:
            </label>

            <select style="
                width: 99%;
                padding: 10px;
                margin-top: 7px;
                border: 1px solid #aaa;
                border-radius: 6px;
                font-size: 15px;
            ">

                <option value="">Select Course</option>
                <option>Data Analytics</option>
                <option>Data Science</option>
                <option>Java Full Stack</option>
                <option>Python Full Stack</option>

            </select>
        </div>


        <div style="margin-bottom: 15px;">

            <label style="font-size: 16px; color: #333;">
                Address:
            </label>

            <textarea placeholder="Enter your address"
                style="
                width: 95%;
                height: 80px;
                padding: 10px;
                margin-top: 7px;
                border: 1px solid #aaa;
                border-radius: 6px;
                font-size: 15px;
                font-family: Arial, sans-serif;
            "></textarea>

        </div>


        
        <div style="margin-bottom: 20px;">

            <input type="checkbox" id="terms">

            <label for="terms" style="font-size: 14px; color: #444;">
                I agree to the Terms & Conditions
            </label>

        </div>


      
        <div style="text-align: center;">

        
             <input type="submit" value="Register"
                style="
                background-color: #1f7a4d;
                color: white;
                width: 130px;
                height: 45px;
                margin: 5px;
                border: none;
                border-radius: 6px;
                font-size: 16px;
                cursor: pointer;
            ">

        
                <input type="reset" value="Reset"
                style="
                background-color: #d9534f;
                color: white;
                width: 130px;
                height: 45px;
                margin: 5px;
                border: none;
                border-radius: 6px;
                font-size: 16px;
                cursor: pointer;
            ">
            
            

        </div>

    </div>
</form>
</body>

</html>
